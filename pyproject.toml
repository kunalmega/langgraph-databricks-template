[project]
name = "langgraph-sample"
version = "0.1.0"
description = "Simple LangGraph ReAct agent on Databricks Apps with Lakebase state + AI Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "databricks-sdk>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.7",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.2.14",
    "mlflow>=2.20.2",
    "databricks-agents>=0.16.0",
    "databricks-langchain>=0.20.0",
]

[tool.uv]
package = false

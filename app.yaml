# Databricks App config (DEPLOYED values for the langgraph-sample app in Fevm-fevm-conde).
# For a fresh reuse of the template, replace these with your own (see .env.example).
#
# Governance: the agent routes LLM calls through the Unity AI Gateway MODEL SERVICE
# 'sonnet4' (primary + fallback + guardrails), authenticated with MODEL_SERVICE_TOKEN
# from a Databricks secret. No direct model-serving endpoint is used.
command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # --- Lakebase (state store) ---
  - name: ENDPOINT_NAME
    value: "projects/langgraph-sample/branches/production/endpoints/primary"
  - name: PGHOST
    value: "ep-noisy-violet-d2mya5gt.database.us-east-1.cloud.databricks.com"
  # PGUSER = the app service-principal client id. OAuthConnection mints the
  # Postgres password via generate_database_credential at runtime.
  - name: PGUSER
    value: "db5da372-cc74-434c-829d-2039902c3374"
  - name: PGDATABASE
    value: "langgraph_app"
  - name: PGPORT
    value: "5432"
  - name: PGSSLMODE
    value: "require"

  # --- Unity AI Gateway (model service) ---
  # Route through the governed model service 'sonnet4' (primary + fallback, guardrails).
  - name: MODEL_SERVICE
    value: "fevm_cme_conde_catalog.langgraph_demo.sonnet4"
  # Token used to call the model service — injected from a Databricks secret (never
  # hardcoded). Requires: scope 'llm' with key 'model_service_token', and the app SP
  # granted READ on that scope. See README Step 3.5.
  - name: MODEL_SERVICE_TOKEN
    valueFrom: "model_service_token"
  - name: AGENT_NAME
    value: "langgraph-sample-agent"

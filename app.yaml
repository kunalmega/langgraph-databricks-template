# Databricks App config — TEMPLATE. Replace every <PLACEHOLDER> with your own value.
#
# These are the environment variables the deployed app sees. For LOCAL runs the
# same values come from .env instead (see .env.example). Nothing here is a secret —
# secrets are injected via `valueFrom` from a Databricks secret scope.
#
# Two ways to govern the LLM (pick one):
#   A) Point UAIG_ENDPOINT at a Unity AI Gateway endpoint (foundation model or your
#      own governed endpoint from register_llm_gateway.py). Simplest; start here.
#   B) Route through a Unity AI Gateway MODEL SERVICE (catalog.schema.name) with a
#      primary + fallback model, authenticated by MODEL_SERVICE_TOKEN from a secret.
# The block below shows (A) active and (B) commented out.
command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # --- Lakebase (state store) ---
  # Paths/hosts are printed by setup/01_provision_lakebase.sh.
  - name: ENDPOINT_NAME
    value: "projects/<LAKEBASE_PROJECT>/branches/production/endpoints/primary"
  - name: PGHOST
    value: "<PGHOST from setup/01 output>"
  # PGUSER = the app service-principal client id (from `databricks apps get <app>`).
  # OAuthConnection mints the Postgres password via generate_database_credential.
  - name: PGUSER
    value: "<APP_SP_CLIENT_ID>"
  - name: PGDATABASE
    value: "langgraph_app"
  - name: PGPORT
    value: "5432"
  - name: PGSSLMODE
    value: "require"

  # --- Unity AI Gateway (option A: a gateway endpoint) ---
  - name: UAIG_ENDPOINT
    value: "<UAIG_ENDPOINT e.g. databricks-claude-sonnet-5 or your governed endpoint>"

  # --- Unity AI Gateway (option B: a governed model service) ---
  # Uncomment to route through a model service instead of UAIG_ENDPOINT.
  # - name: MODEL_SERVICE
  #   value: "<catalog>.<schema>.<model_service_name>"
  # - name: MODEL_SERVICE_AUTH
  #   value: "token"            # "token" (needs MODEL_SERVICE_TOKEN) or "oauth"
  # - name: MODEL_SERVICE_TOKEN
  #   valueFrom: "<secret key configured on this app's resources>"

  - name: AGENT_NAME
    value: "<AGENT_NAME e.g. langgraph-sample-agent>"

  # --- Operational toggles (safe defaults) ---
  # Require the forwarded end-user identity on /api/chat (recommended multi-tenant).
  - name: REQUIRE_CALLER_IDENTITY
    value: "false"
  # The one-time /api/setup DDL route is OFF by default. Enable only for a bootstrap
  # run, then set back to "false". Prefer running setup/ scripts for provisioning.
  - name: ENABLE_SETUP_ROUTE
    value: "false"
